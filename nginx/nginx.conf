events {}

http {
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # Proxy API requests to FastAPI container
        location /predict {
            proxy_pass http://fastapi:8000/predict;
        }

        location /update {
            proxy_pass http://fastapi:8000/update;
        }
    }
}
